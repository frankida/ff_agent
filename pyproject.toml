[project]
name = "fantasy-agent"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "espn-api>=0.33",
    "yahoo-fantasy-api>=1.20",
    "anthropic>=0.34",
    "httpx>=0.27",
    "rapidfuzz>=3.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "requests-oauthlib>=1.3",
    "nfl-data-py>=0.3",
]

[project.scripts]
fantasy = "fantasy_agent.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fantasy_agent"]
